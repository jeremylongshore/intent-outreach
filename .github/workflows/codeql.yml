name: CodeQL

# Separate from ci.yml so it can have its own permissions (security-events: write) and a
# weekly schedule that catches newly published queries against unchanged code.
# Required-check name for branch protection: analyze (javascript-typescript)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          # bundle/ is esbuild output that inlines third-party packages (zod, ai,
          # @ai-sdk/*); those are scanned upstream, and our own sources are scanned
          # here before bundling. Scanning the bundle only re-reports vendor code.
          config: |
            paths-ignore:
              - bundle/**
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:javascript-typescript"
