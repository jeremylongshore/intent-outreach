name: BatchData demo boundaries
on:
  pull_request:
    paths: ['demos/batchdata-sandbox/**', '.github/workflows/batchdata-demo.yml']
  push:
    branches: [main]
    paths: ['demos/batchdata-sandbox/**', '.github/workflows/batchdata-demo.yml']
permissions:
  contents: read
jobs:
  boundaries:
    name: batchdata-demo-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Credential, origin, cache and persistent admission tests (no vendor traffic)
        run: python3 -m unittest discover -s demos/batchdata-sandbox -p 'test_*.py' -v
      - name: Deployment script parses
        run: bash -n demos/batchdata-sandbox/deploy_public.sh
