name: CI
on: [pull_request, push]

# Complements policy.yml (which enforces the architectural invariants). This is
# the build/test gate: typecheck, unit tests, the free offline eval gate, and a
# build (which also confirms prompts/ get copied into dist/).

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Eval gate (offline, deterministic)
        run: npx tsx evals/run.ts --offline
      - name: Build
        run: npm run build
      - name: Bundle is fresh (committed bundle/ matches source)
        run: |
          npm run bundle
          git diff --exit-code -- bundle/ \
            || { echo "❌ bundle/ is stale — run 'npm run bundle' and commit the result"; exit 1; }
      - name: Smoke — shipped CLI binary runs
        run: |
          node bundle/cli.mjs --help
          node bundle/cli.mjs providers
      - name: Smoke — MCP server answers initialize (no CLAUDE_PLUGIN_ROOT)
        run: |
          unset CLAUDE_PLUGIN_ROOT
          out=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 10 node bundle/server.mjs || true)
          echo "$out"
          echo "$out" | grep -q '"serverInfo"' \
            || { echo "❌ bundle/server.mjs did not answer MCP initialize"; exit 1; }
